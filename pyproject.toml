[project]
name = "intraday-xs-alpha"
version = "0.1.0"
description = "Intraday cross-sectional alpha research on liquid U.S. equities (Phase 0-1 complete)"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "pandas-market-calendars>=4.4",
    "requests>=2.32",
]

[project.optional-dependencies]
alpaca = [
    "alpaca-py>=0.30",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
